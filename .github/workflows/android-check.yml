name: Android check

on:
  workflow_dispatch:
  push:
    branches: [prod]
    paths: ['android/**', 'src-tauri/**', 'scripts/prepare-android.mjs', '.github/workflows/android-check.yml']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - name: Locate NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK" ]; then NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -n1); fi
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
      - name: Generate Android project
        run: npx tauri android init --ci
      - name: Use a build-only Firebase fixture
        run: |
          cp android/google-services.example.json android/google-services.json
          node scripts/prepare-android.mjs --unsigned
      - name: Compile Android Rust and Kotlin without publishing
        run: npx tauri android build --apk --debug --target aarch64 --ci
